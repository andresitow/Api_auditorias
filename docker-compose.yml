services:
  postgres:
    image: postgres:16-alpine
    container_name: auditorias-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: infraestructura
    ports:
      - "5432:5432"
    volumes:
      - auditorias_pgdata:/var/lib/postgresql/data
    # fsync/synchronous_commit/full_page_writes off trade durability for I/O — fine for
    # disposable local dev data, never use these on a database that must survive a crash.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  auditorias_pgdata:
